name: motorcheck
description: 'Personal vehicle maintenance tracking app'
publish_to: 'none'
version: 0.2.0+2

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  cupertino_icons: ^1.0.8
  go_router: ^14.8.1
  sqflite: ^2.4.1
  sqflite_common_ffi: ^2.3.4+4
  path: ^1.9.1
  path_provider: ^2.1.5
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  intl: ^0.20.3
  shared_preferences: ^2.5.5
  flutter_local_notifications: ^22.2.0
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1
  file_selector: ^1.1.0
  share_plus: ^13.3.1
  archive: ^4.6.0
  csv: ^8.0.0
  pdf: ^3.13.1
  printing: ^5.15.1
  image_picker: ^1.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.3
  build_runner: ^2.17.1
  freezed: ^4.0.3
  json_serializable: ^6.15.2
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/OFL.txt
  fonts:
    - family: Barlow
      fonts:
        - asset: assets/fonts/Barlow-Regular.ttf
          weight: 400
        - asset: assets/fonts/Barlow-Medium.ttf
          weight: 500
        - asset: assets/fonts/Barlow-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Barlow-Bold.ttf
          weight: 700
    - family: BarlowSemiCondensed
      fonts:
        - asset: assets/fonts/BarlowSemiCondensed-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BarlowSemiCondensed-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/app_icon.png
  adaptive_icon_background: "#1F2328"
  adaptive_icon_foreground: assets/icon/app_icon_foreground.png
  min_sdk_android: 21
